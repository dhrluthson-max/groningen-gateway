<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemeente Groningen - AI Gateway</title>
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: #0b1329;
            --border-color: #1e293b;
            --primary-cyan: #06b6d4;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Subtiele quantum-glow op de achtergrond */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(6, 182, 212, 0.15);
            border-radius: 50%;
            filter: blur(80px);
            top: 20%;
            left: 25%;
        }

        .gateway-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(6, 182, 212, 0.1);
            position: relative;
            z-index: 1;
        }

        .header-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .logo-icon {
            font-size: 24px;
        }

        .company-name {
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin: 0;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-top: 10px;
            margin-bottom: 20px;
            letter-spacing: -0.02em;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="password"] {
            width: 100%;
            background-color: #030712;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary-cyan);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15);
        }

        .unlock-btn {
            width: 100%;
            background-color: transparent;
            border: 1px solid rgba(6, 182, 212, 0.4);
            color: var(--primary-cyan);
            border-radius: 8px;
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .unlock-btn:hover {
            background-color: rgba(6, 182, 212, 0.08);
            border-color: var(--primary-cyan);
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.2);
        }

        .error-message {
            color: #ef4444;
            font-size: 13px;
            margin-top: 10px;
            display: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="gateway-container">
        <div class="header-section">
            <span class="logo-icon">🏛️</span>
            <p class="company-name">Gemeente Groningen AI</p>
        </div>
        <h1>Beveiligde Enterprise Core Toegang</h1>
        <p>Voer uw unieke Puriel-licentiesleutel in om de soevereine RAG-omgeving en systeemtelemetrie te betreden.</p>
        
        <div class="form-group">
            <label for="license-key">Licentiesleutel</label>
            <div class="input-wrapper">
                <input type="password" id="license-key" placeholder="••••••••••••••••">
            </div>
            <div id="error-box" class="error-message">⚠️ Ongeldige licentiesleutel. Toegang geweigerd.</div>
        </div>

        <button class="unlock-btn" onclick="validateAndRedirect()">
            <span>🔒</span> Systeem Ontgrendelen
        </button>
    </div>

    <script>
        function validateAndRedirect() {
            const inputKey = document.getElementById('license-key').value;
            const errorBox = document.getElementById('error-box');
            
            // MASTER CONFIG: De universele sleutel voor de selectiecommissie
            // Vervang 'JOUW_STREAMLIT_APP_URL' door de echte link van de Streamlit Cloud
            const MASTER_KEY = "GRONINGEN-AI-2026";
            const TARGET_URL = "https://streamlit.app";

            if (inputKey === MASTER_KEY) {
                errorBox.style.display = "none";
                window.open(TARGET_URL, '_blank');
            } else {
                errorBox.style.display = "block";
            }
        }

        // Zorg dat 'Enter' ook de knop activeert
        document.getElementById("license-key").addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                validateAndRedirect();
            }
        });
    </script>

</body>
</html>
